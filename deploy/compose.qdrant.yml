# compose.qdrant.yml
# -----------------------------------------------------------------------------
# Standalone stack for Qdrant (vector DB).
# Reachable only from nexus_coffee via container name ord_qdrant.
# -----------------------------------------------------------------------------

services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: ord_qdrant
    restart: unless-stopped

    entrypoint:
      - /bin/sh
      - -c
      - |
        export QDRANT__SERVICE__API_KEY="$$(cat /run/secrets/qdrant_api_key)"
        exec ./entrypoint.sh

    environment:
      QDRANT__SERVICE__HOST: 0.0.0.0
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__LOG_LEVEL: INFO
      QDRANT__TELEMETRY_DISABLED: "true"
      TZ: UTC

    secrets:
      - qdrant_api_key

    volumes:
      - qdrant_data:/qdrant/storage:Z

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - nexus_coffee

volumes:
  qdrant_data:

networks:
  nexus_coffee:
    external: true

secrets:
  qdrant_api_key:
    external: true