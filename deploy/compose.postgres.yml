# compose.postgres.yml
# -----------------------------------------------------------------------------
# Standalone stack for PostgreSQL.
# Reachable only from nexus_coffee via container name ord_postgres.
# -----------------------------------------------------------------------------

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ord_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-agent_hub}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      TZ: UTC

    secrets:
      - pg_password

    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:Z

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nexus_coffee

volumes:
  pg_data:

networks:
  nexus_coffee:
    external: true

secrets:
  pg_password:
    external: true